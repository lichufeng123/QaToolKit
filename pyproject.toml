[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "qatoolkit"
version = "0.1.0"
description = "QAToolKit agents for API testing and iteration test statistics"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31.0",
    "aiohttp>=3.8.0",
    "pydantic>=2.0.0",
    "PyYAML>=6.0",
    "Jinja2>=3.1.0",
]

[project.scripts]
qatoolkit = "qatoolkit.cli:main"
qatoolkit-zentao-stats-mcp = "qatoolkit.mcp_servers.zentao_stats:main"

[project.optional-dependencies]
mcp = [
    "mcp>=1.0.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
